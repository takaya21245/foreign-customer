<html lang="ja">
<head>
<meta charset="utf-8">

<title>外国語接客ボード</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#222;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.wrap{max-width:820px;margin:auto;padding:16px}h1{font-size:27px;margin:6px 0 18px}
label{font-weight:700;display:block;margin-bottom:7px}
select,input,button{font:inherit}select{width:100%;padding:14px;border:1px solid #bbb;border-radius:12px;background:#fff}
.position-row{display:flex;gap:8px;margin-bottom:18px}.position-row select{flex:1}.position-row button{width:150px;white-space:nowrap}
.toolbar{display:flex;gap:8px;margin:12px 0}.toolbar button{flex:1}
button{padding:14px 12px;border:0;border-radius:13px;background:#fff;box-shadow:0 2px 8px #0001;font-weight:700;cursor:pointer}
.primary{background:#222;color:#fff}.edit{background:#e9e9e9}.delete{background:#fff0f0;color:#b00020}.move{width:105px;background:#eee;font-size:14px}.stop{width:82px;min-width:82px;background:#ffe9e9;color:#a00000;display:none;white-space:nowrap}.stop.show{display:block}.stop.show{display:block}

.insert-slot{display:none;border:2px dashed #aaa;border-radius:12px;padding:8px;background:#fafafa}.insert-slot.show{display:block}.insert-slot button{width:100%;box-shadow:none}
.move-active{outline:3px solid #888}.free{display:flex;gap:8px;margin-top:18px;align-items:stretch}.free button{white-space:nowrap}.free input{flex:1;padding:14px;border:1px solid #bbb;border-radius:12px}

.panel{width:min(560px,100%);background:#fff;border-radius:18px;padding:20px;box-shadow:0 10px 40px #0005}.panel h2{margin-top:0}.panel input{width:100%;padding:14px;margin:8px 0 14px;border:1px solid #bbb;border-radius:12px}
.actions{display:flex;gap:8px}.actions button{flex:1}.manage-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}.manage-item{display:flex;gap:8px;align-items:center}.manage-item span{flex:1;padding:13px;border:1px solid #ddd;border-radius:10px;background:#fafafa}.manage-item button{padding:11px 9px;white-space:nowrap}
.note{font-size:13px;color:#666;margin:0 0 14px}

#phraseEditDialog .panel{max-width:620px}
#phraseEditInput{width:100%;font-size:18px}
#phraseEditPreview{
  background:#f7f7f7;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
}

#staffView{height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:0}
.board-main{flex:1 1 0;min-height:0;overflow-y:auto;width:100%;margin:0 auto;overscroll-behavior:contain}
.board-dock{flex:0 0 auto;background:#f4f4f4;border-top:1px solid #ccc;box-shadow:0 -3px 12px #0001;padding-bottom:env(safe-area-inset-bottom,0px);max-height:55vh;max-height:55dvh;overflow:auto}
.dock-inner{padding-top:10px;padding-bottom:10px;width:100%}
.dock-inner .free{margin-top:0;flex-wrap:wrap}
.dock-inner .free input{min-width:0}
.dock-inner .status{overflow-wrap:anywhere;min-height:0}
.dock-inner .status:empty{margin-top:0}
@media(max-width:480px){.dock-inner .free input{flex-basis:100%}.dock-inner .free button{flex:1}}
.panel{max-height:90vh;overflow:auto}
.card .speak.custom-label{background:#eaf3ff;color:#1757a6}.card .speak.selected-phrase{outline:3px solid #d00020;outline-offset:-3px}.play-controls{display:flex;gap:8px;align-items:center;margin-top:8px}.play-controls .stop{width:auto;min-width:82px}.translation-replay{background:#e9e9e9}
</style>

<div id="staffView">
<main class="wrap board-main">
<div class="board-title-row">

</div>

<label for="position">ポジションを選択</label>
<div class="position-row">
<select id="position"></select>

<label for="lang">言語を選択</label>
<select id="lang"><option value="en">英語</option><option value="af">アフリカーンス語</option><option value="sq">アルバニア語</option><option value="am">アムハラ語</option><option value="ar">アラビア語</option><option value="hy">アルメニア語</option><option value="az">アゼルバイジャン語</option><option value="eu">バスク語</option><option value="bn">ベンガル語</option><option value="bg">ブルガリア語</option><option value="ca">カタルーニャ語</option><option value="zh-CN">中国語（簡体）</option><option value="zh-TW">中国語（繁体）</option><option value="hr">クロアチア語</option><option value="cs">チェコ語</option><option value="da">デンマーク語</option><option value="nl">オランダ語</option><option value="et">エストニア語</option><option value="fi">フィンランド語</option><option value="fr">フランス語</option><option value="gl">ガリシア語</option><option value="ka">ジョージア語</option><option value="de">ドイツ語</option><option value="el">ギリシャ語</option><option value="gu">グジャラート語</option><option value="ht">ハイチ語</option><option value="he">ヘブライ語</option><option value="hi">ヒンディー語</option><option value="hu">ハンガリー語</option><option value="is">アイスランド語</option><option value="id">インドネシア語</option><option value="ga">アイルランド語</option><option value="it">イタリア語</option><option value="ja">日本語</option><option value="kn">カンナダ語</option><option value="kk">カザフ語</option><option value="km">クメール語</option><option value="ko">韓国語</option><option value="ky">キルギス語</option><option value="lo">ラオ語</option><option value="lv">ラトビア語</option><option value="lt">リトアニア語</option><option value="mk">マケドニア語</option><option value="ms">マレー語</option><option value="ml">マラヤーラム語</option><option value="mt">マルタ語</option><option value="mr">マラーティー語</option><option value="mn">モンゴル語</option><option value="my">ミャンマー語</option><option value="ne">ネパール語</option><option value="no">ノルウェー語</option><option value="or">オディア語</option><option value="fa">ペルシャ語</option><option value="pl">ポーランド語</option><option value="pt">ポルトガル語</option><option value="pa">パンジャブ語</option><option value="ro">ルーマニア語</option><option value="ru">ロシア語</option><option value="sr">セルビア語</option><option value="sk">スロバキア語</option><option value="sl">スロベニア語</option><option value="es">スペイン語</option><option value="sw">スワヒリ語</option><option value="sv">スウェーデン語</option><option value="tl">タガログ語</option><option value="tg">タジク語</option><option value="ta">タミル語</option><option value="te">テルグ語</option><option value="th">タイ語</option><option value="tr">トルコ語</option><option value="uk">ウクライナ語</option><option value="ur">ウルドゥー語</option><option value="uz">ウズベク語</option><option value="vi">ベトナム語</option><option value="cy">ウェールズ語</option><option value="yo">ヨルバ語</option><option value="zu">ズールー語</option><option value="ace">アチェ語</option><option value="ach">アチョリ語</option><option value="awa">アワディー語</option><option value="bal">バローチー語</option><option value="ban">バリ語</option><option value="ba">バシキール語</option><option value="bho">ボージュプリー語</option><option value="br">ブルトン語</option><option value="bug">ブギス語</option><option value="ch">チャモロ語</option><option value="cv">チュヴァシ語</option><option value="doi">ドーグリー語</option><option value="fj">フィジー語</option><option value="fon">フォン語</option><option value="fur">フリウリ語</option><option value="gaa">ガ語</option><option value="gom">コンカニ語</option><option value="ilo">イロカノ語</option><option value="kri">クリオ語</option><option value="ln">リンガラ語</option><option value="lg">ルガンダ語</option><option value="mai">マイティリー語</option><option value="mni-Mtei">マニプリ語</option><option value="lus">ミゾ語</option><option value="om">オロモ語</option><option value="pap">パピアメント語</option><option value="qu">ケチュア語</option><option value="sa">サンスクリット語</option><option value="nso">北ソト語</option><option value="ti">ティグリニャ語</option><option value="ts">ツォンガ語</option><option value="tn">ツワナ語</option><option value="tum">トゥンブカ語</option><option value="tw">トウィ語</option><option value="ve">ヴェンダ語</option><option value="war">ワライ語</option><option value="wo">ウォロフ語</option><option value="yue">広東語</option><option value="ber">ベルベル語</option></select>


<div class="toolbar">

<button class="edit" id="editMode">編集</button>
<div style="display:flex;align-items:center;gap:8px;margin:0 0 12px"><label for="columns" style="margin:0;white-space:nowrap">フレーズの列数</label><select id="columns" style="margin:0;flex:1"><option value="1">1列</option><option value="2">2列</option><option value="3">3列</option><option value="4">4列</option></select></div>
</div>
<div id="buttons" class="grid"></div>

</main>
<section class="board-dock"><div class="wrap dock-inner"><div class="free"><input id="custom" placeholder="その他の文章を日本語で入力">
<button id="clearCustom" class="delete">消去</button><button id="addCustomPhrase" class="edit">＋ 追加</button><button class="primary" id="customSpeak">🔊 再生</button></div>
<div id="status" class="status"></div>
</div></section>

<div id="positionDialog" class="dialog"><div class="panel">
<h2>ポジション管理</h2><p class="note">ポジションごとに別々のフレーズを保存できます。</p>
<div id="positionList" class="manage-list"></div>
<button class="primary" style="width:100%;margin-bottom:8px" id="addPosition">＋ ポジションを追加</button>
<button style="width:100%" id="closePosition">閉じる</button>
</div></div>

<div id="nameDialog" class="dialog"><div class="panel">
<h2 id="nameTitle">ポジションを追加</h2>
<input id="positionName" placeholder="例：受付">
<div class="actions"><button id="cancelName">キャンセル</button><button class="primary" id="saveName">保存</button></div>
</div></div>

<div id="phraseDialog" class="dialog"><div class="panel">
<h2>フレーズを追加</h2>
<input id="phraseInput" placeholder="例：こちらでお待ちください">
<div class="actions"><button id="cancelPhrase">キャンセル</button><button class="primary" id="savePhrase">追加</button></div>
</div></div>


<div id="phraseEditDialog" class="dialog">
  <div class="panel">
    <h2>フレーズを変更</h2>
    <label for="phraseEditInput">日本語のフレーズ</label>
    <input id="phraseEditInput" placeholder="日本語または英語などの原文を入力">
    <label for="phraseDisplayInput">表示するフレーズ（任意）</label>
    <input id="phraseDisplayInput" placeholder="一覧に表示する文章（空欄なら原文）">
    <div id="phraseEditPreview" style="margin:10px 0 14px;min-height:50px"></div>
    <div class="actions">
      <button id="cancelPhraseEdit">キャンセル</button>
      <button class="primary" id="savePhraseEdit">保存</button>
    </div>
  </div>
</div>
</div>

<script>

const initialPhrases=[];

const KEY="foreignServicePositions_v2";
let state;
try{state=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){state=null}
if(!state){
  // Migrate the previous single-list data if it exists.
  let old=[];
  try{old=JSON.parse(localStorage.getItem("foreignServicePhrases")||"null")}catch(e){}
  if(!Array.isArray(old))old=initialPhrases.slice();
  state={positions:["受付"],phrases:{"受付":old},selected:"受付"};
}
if(!Array.isArray(state.positions)||!state.positions.length)state.positions=["受付"];
if(!state.phrases)state.phrases={};
state.positions.forEach(x=>{if(!Array.isArray(state.phrases[x]))state.phrases[x]=[]});
if(!state.selected||!state.positions.includes(state.selected))state.selected=state.positions[0];

function repairSavedBoardState(){
 if(!state || typeof state!=="object")return;
 if(!Array.isArray(state.positions))state.positions=[];
 if(!state.phrases || typeof state.phrases!=="object")state.phrases={};
 Object.keys(state.phrases).forEach(name=>{
   if(!state.positions.includes(name))state.positions.push(name);
 });
 if(!state.positions.length)state.positions=["受付"];
 state.positions.forEach(name=>{
   if(!Array.isArray(state.phrases[name]))state.phrases[name]=[];
 });
 if(!state.selected || !state.positions.includes(state.selected))state.selected=state.positions[0];
 localStorage.setItem(KEY,JSON.stringify(state));
}
repairSavedBoardState();

const ORIGINAL_DEFAULT_PHRASES=["予約されていますか？", "チケットをお持ちですか？", "チケットを確認します。チケットを見せてください。", "画面を触っていいですか？", "お店を出て左側にロッカーがあります。", "ロッカーに荷物を預けてください。", "スタッフが呼びにくるまでロッカーの前でお待ちください。", "トイレは奥のグレーの扉です。", "何人で参加しますか？", "チケットのサイトにログインしてください。", "受付開始の時間は10分前からです。"];
const DEFAULT_PHRASE_MIGRATION_KEY="removeOriginalDefaultPhrases_v1";
if(localStorage.getItem(DEFAULT_PHRASE_MIGRATION_KEY)!=="done"){
  try{
    if(state && state.phrases){
      Object.keys(state.phrases).forEach(function(pos){
        if(Array.isArray(state.phrases[pos])){
          state.phrases[pos]=state.phrases[pos].filter(function(p){
            return !ORIGINAL_DEFAULT_PHRASES.includes(p);
          });
        }
      });
      localStorage.setItem(KEY,JSON.stringify(state));
    }
    localStorage.setItem(DEFAULT_PHRASE_MIGRATION_KEY,"done");
  }catch(e){}
}


let edit=false,moving=null,editingPosition=null;
let columns=Number(localStorage.getItem("foreignServiceColumns")||"1");
if(![1,2,3,4].includes(columns))columns=1;
const $=id=>document.getElementById(id);
const position=$("position"),buttons=$("buttons"),status=$("status");

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function list(){
 if(!state.phrases)state.phrases={};
 if(!Array.isArray(state.positions)||!state.positions.length)state.positions=["受付"];
 if(!state.selected || !state.positions.includes(state.selected))state.selected=state.positions[0];
 if(!Array.isArray(state.phrases[state.selected]))state.phrases[state.selected]=[];
 return state.phrases[state.selected];
}
function renderPositions(){
 if(!position)return;
 if(!Array.isArray(state.positions)||!state.positions.length){
   state.positions=["受付"];
   if(!state.phrases)state.phrases={};
   if(!Array.isArray(state.phrases["受付"]))state.phrases["受付"]=[];
   state.selected="受付";
   save();
 }
 position.innerHTML="";
 state.positions.forEach(p=>{
   let o=document.createElement("option");
   o.value=p;
   o.textContent=p;
   if(p===state.selected)o.selected=true;
   position.appendChild(o);
 });
 position.value=state.selected;
}
let selectedPhrase=null;
function phraseText(p){return typeof p==="string"?p:p.text;}
function phraseLabel(p){return typeof p==="string"?"":(p.label||"");}
function render(){
 renderPositions();$("columns").value=columns;buttons.style.setProperty("--cols",columns);let arr=list();buttons.innerHTML="";
 for(let slot=0;slot<=arr.length;slot++){
   let ins=document.createElement("div");ins.className="insert-slot"+(moving!==null?" show":"");
   if(moving!==null){let b=document.createElement("button");b.textContent=slot===0?"⬆ ここに移動（先頭）":slot===arr.length?"⬇ ここに移動（最後）":"↕ ここに移動";b.onclick=()=>moveTo(slot);ins.appendChild(b)}
   buttons.appendChild(ins);
   if(slot<arr.length){
     let c=document.createElement("div");c.className="card"+(moving===slot?" move-active":"");
     let sp=document.createElement("button");sp.className="speak";
     const item=arr[slot], label=phraseLabel(item);
     sp.textContent=(edit?"☰ ":"🔊 ")+(label||phraseText(item));
     if(label)sp.classList.add("custom-label");
     if(selectedPhrase && selectedPhrase.position===state.selected && selectedPhrase.index===slot)sp.classList.add("selected-phrase");
     sp.onclick=()=>{if(edit){editPhraseText(slot);return;}selectedPhrase={position:state.selected,index:slot};buttons.querySelectorAll(".selected-phrase").forEach(x=>x.classList.remove("selected-phrase"));sp.classList.add("selected-phrase");translateAndSpeak(phraseText(item));};
     c.appendChild(sp);
     if(edit){
       let m=document.createElement("button");m.className="move";m.textContent=moving===slot?"移動中…":"位置を移動";m.onclick=()=>startMove(slot);c.appendChild(m);
       let d=document.createElement("button");d.className="delete";d.textContent="削除";d.onclick=()=>delPhrase(slot);c.appendChild(d)
     }
     buttons.appendChild(c)
   }
 }
}
$("columns").onchange=()=>{stopSpeaking();columns=Number($("columns").value);if(![1,2,3,4].includes(columns))columns=1;localStorage.setItem("foreignServiceColumns",String(columns));render();status.textContent=columns+"列表示に変更しました。"};
position.onchange=()=>{stopSpeaking();selectedPhrase=null;state.selected=position.value;edit=false;moving=null;$("editMode").textContent="編集";save();render();status.textContent=state.selected+" のフレーズを表示しています。"};
$("editMode").onclick=()=>{edit=!edit;moving=null;$("editMode").textContent=edit?"✓ 完了":"編集";render()};
function startMove(i){moving=i;status.textContent="移動先の「ここに移動」を押してください。";render()}
function moveTo(slot){selectedPhrase=null;let a=list();let item=a.splice(moving,1)[0];let target=slot;if(moving<slot)target--;a.splice(target,0,item);moving=null;save();render();status.textContent="フレーズを移動しました。"}

let editingPhraseIndex=null;
let phraseEditTimer=null;
let phraseEditRequestId=0;

function editPhraseText(i){
  editingPhraseIndex=i;
  const input=$("phraseEditInput");
  input.value=phraseText(list()[i]) || "";
  $("phraseDisplayInput").value=phraseLabel(list()[i]);
  $("phraseEditPreview").innerHTML="";
  $("phraseEditDialog").classList.add("show");
  setTimeout(()=>{
    input.focus();
    input.setSelectionRange(input.value.length,input.value.length);
    schedulePhraseEditPreview();
  },50);
}

function closePhraseEdit(){
  phraseEditRequestId++;
  $("phraseEditDialog").classList.remove("show");
  editingPhraseIndex=null;
  clearTimeout(phraseEditTimer);
}

function schedulePhraseEditPreview(){
  clearTimeout(phraseEditTimer);
  const text=$("phraseEditInput").value;
  phraseEditTimer=setTimeout(()=>{
    showPhraseEditPreview(text);
  },350);
}

async function showPhraseEditPreview(text){
  const preview=$("phraseEditPreview");
  const requestId=++phraseEditRequestId;

  if(!text || !text.trim()){
    preview.innerHTML="";
    return;
  }

  preview.textContent="翻訳しています…";

  try{
    const targetLang=$("lang").value;

    const forwardUrl="https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl="+encodeURIComponent(targetLang)+"&dt=t&q="+encodeURIComponent(text);
    const forwardRes=await fetch(forwardUrl);
    const forwardData=await forwardRes.json();
    const translated=(targetLang==="en" && forwardData[2]==="en")?text:forwardData[0].map(x=>x[0]).join("");

    let backTranslated=text;
    if(targetLang!=="ja"){
      const backUrl="https://translate.googleapis.com/translate_a/single?client=gtx&sl="+encodeURIComponent(targetLang)+"&tl=ja&dt=t&q="+encodeURIComponent(translated);
      const backRes=await fetch(backUrl);
      const backData=await backRes.json();
      backTranslated=backData[0].map(x=>x[0]).join("");
    }

    if(requestId!==phraseEditRequestId)return;

    preview.innerHTML="";

    const translatedLine=document.createElement("div");
    translatedLine.textContent=translated;
    translatedLine.style.fontWeight="700";
    translatedLine.style.fontSize="18px";
    preview.appendChild(translatedLine);

    const backLine=document.createElement("div");
    backLine.textContent="逆翻訳： "+backTranslated;
    backLine.style.marginTop="6px";
    backLine.style.fontSize="14px";
    backLine.style.color="#666";
    preview.appendChild(backLine);

  }catch(e){
    if(requestId!==phraseEditRequestId)return;
    preview.textContent="翻訳に失敗しました。インターネット接続を確認してください。";
  }
}


function delPhrase(i){if(confirm("このフレーズを削除しますか？")){list().splice(i,1);selectedPhrase=null;moving=null;save();render();status.textContent="フレーズを削除しました。"}}

function show(id){$(id).classList.add("show")}function hide(id){$(id).classList.remove("show")}
$("cancelPhrase").onclick=()=>hide("phraseDialog");
$("savePhrase").onclick=()=>{let v=$("phraseInput").value.trim();if(!v)return;list().push(v);save();render();hide("phraseDialog");status.textContent="フレーズを追加しました。"};

$("managePosition").onclick=()=>{renderPositionManager();show("positionDialog")};
$("closePosition").onclick=()=>hide("positionDialog");
function renderPositionManager(){
 let box=$("positionList");box.innerHTML="";
 state.positions.forEach((p,i)=>{
  let row=document.createElement("div");row.className="manage-item";
  let s=document.createElement("span");s.textContent=p;row.appendChild(s);

  let up=document.createElement("button");up.textContent="↑";up.title="上へ";
  up.disabled=i===0;up.onclick=()=>movePosition(i,-1);row.appendChild(up);

  let down=document.createElement("button");down.textContent="↓";down.title="下へ";
  down.disabled=i===state.positions.length-1;down.onclick=()=>movePosition(i,1);row.appendChild(down);

  let e=document.createElement("button");e.textContent="名前変更";e.onclick=()=>openRename(p);row.appendChild(e);
  let d=document.createElement("button");d.className="delete";d.textContent="削除";d.onclick=()=>deletePosition(p);row.appendChild(d);
  box.appendChild(row)
 })
}
$("addPosition").onclick=()=>openNewPosition();
function openNewPosition(){editingPosition=null;$("nameTitle").textContent="ポジションを追加";$("positionName").value="";show("nameDialog");setTimeout(()=>$("positionName").focus(),50)}
function openRename(old){editingPosition=old;$("nameTitle").textContent="ポジション名を変更";$("positionName").value=old;show("nameDialog");setTimeout(()=>$("positionName").select(),50)}
$("cancelName").onclick=()=>hide("nameDialog");
$("saveName").onclick=()=>{
 let n=$("positionName").value.trim();if(!n)return;
 if(state.positions.includes(n)&&n!==editingPosition){alert("同じ名前のポジションがすでにあります。");return}
 if(editingPosition===null){state.positions.push(n);state.phrases[n]=[];state.selected=n}
 else{let i=state.positions.indexOf(editingPosition);state.positions[i]=n;state.phrases[n]=state.phrases[editingPosition]||[];if(n!==editingPosition)delete state.phrases[editingPosition];if(state.selected===editingPosition)state.selected=n}
 save();hide("nameDialog");render();renderPositionManager();status.textContent="ポジションを保存しました。"
};
function movePosition(index,direction){
  const target=index+direction;
  if(target<0||target>=state.positions.length)return;
  const temp=state.positions[index];
  state.positions[index]=state.positions[target];
  state.positions[target]=temp;
  save();render();renderPositionManager();
  status.textContent="ポジションの順番を変更しました。";
}

function deletePosition(p){
 if(state.positions.length<=1){alert("ポジションは1つ以上必要です。");return}
 if(!confirm("「"+p+"」を削除しますか？\\nこのポジションのフレーズも削除されます。"))return;
 let i=state.positions.indexOf(p);state.positions.splice(i,1);delete state.phrases[p];
 if(state.selected===p)state.selected=state.positions[Math.max(0,i-1)];
 save();render();renderPositionManager();status.textContent="ポジションを削除しました。"
}

let activeStopButton=null, speechToken=0, playRequest=0;
function setActiveStopButton(btn){
 if(activeStopButton)activeStopButton.classList.remove("show");
 activeStopButton=btn||null;
 if(activeStopButton)activeStopButton.classList.add("show");
}
function stopSpeaking(){
 speechToken++;playRequest++;
 if("speechSynthesis" in window)speechSynthesis.cancel();
 setActiveStopButton(null);
}
let liveTranslationTimer=null;
let liveTranslationRequestId=0;

function addCustomPhraseToCurrentPosition(){
 const v=$("custom").value.trim();
 if(!v)return;
 list().push(v);
 save();
 render();
 status.textContent="フレーズを追加しました。";
}

async function showTranslationPreview(text){
  const requestId=++liveTranslationRequestId;

  if(!text || !text.trim()){
    status.innerHTML="";
    return;
  }

  status.textContent="翻訳しています…";

  try{
    const targetLang=$("lang").value;

    const forwardUrl="https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl="+encodeURIComponent(targetLang)+"&dt=t&q="+encodeURIComponent(text);
    const forwardRes=await fetch(forwardUrl);
    const forwardData=await forwardRes.json();
    const translated=(targetLang==="en" && forwardData[2]==="en")?text:forwardData[0].map(x=>x[0]).join("");

    let backTranslated=text;
    if(targetLang!=="ja"){
      const backUrl="https://translate.googleapis.com/translate_a/single?client=gtx&sl="+encodeURIComponent(targetLang)+"&tl=ja&dt=t&q="+encodeURIComponent(translated);
      const backRes=await fetch(backUrl);
      const backData=await backRes.json();
      backTranslated=backData[0].map(x=>x[0]).join("");
    }

    if(requestId!==liveTranslationRequestId)return;

    status.innerHTML="";

    const translatedLine=document.createElement("div");
    translatedLine.textContent=translated;
    translatedLine.style.fontWeight="700";
    translatedLine.style.fontSize="18px";
    status.appendChild(translatedLine);

    const backLine=document.createElement("div");
    backLine.textContent="逆翻訳： "+backTranslated;
    backLine.style.marginTop="6px";
    backLine.style.fontSize="14px";
    backLine.style.color="#666";
    status.appendChild(backLine);
  }catch(e){
    if(requestId!==liveTranslationRequestId)return;
    status.textContent="翻訳に失敗しました。インターネット接続を確認してください。";
  }
}

function scheduleLiveTranslation(){
  stopSpeaking();
  clearTimeout(liveTranslationTimer);
  const text=$("custom").value;
  liveTranslationTimer=setTimeout(function(){
    showTranslationPreview(text);
  },350);
}

function makeTranslationDisplay(parent,translated,targetLang,stopButton){
  parent.innerHTML="";
  const translatedLine=document.createElement("div");
  translatedLine.textContent=translated;
  translatedLine.style.fontWeight="700";
  translatedLine.style.fontSize="18px";
  parent.appendChild(translatedLine);
  return translatedLine;
}

async function translateAndSpeak(text){
 stopSpeaking();
 const request=playRequest;
 clearTimeout(liveTranslationTimer);liveTranslationRequestId++;
 status.textContent="翻訳しています…";
 try{
  if("speechSynthesis" in window)speechSynthesis.cancel();
  if(typeof setActiveStopButton==="function")setActiveStopButton(null);

  const targetLang=$("lang").value;

  const forwardUrl="https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl="+encodeURIComponent(targetLang)+"&dt=t&q="+encodeURIComponent(text);
  const forwardRes=await fetch(forwardUrl);
  const forwardData=await forwardRes.json();
  const translated=(targetLang==="en" && forwardData[2]==="en")?text:forwardData[0].map(x=>x[0]).join("");

  let backTranslated=text;
  if(targetLang!=="ja"){
    const backUrl="https://translate.googleapis.com/translate_a/single?client=gtx&sl="+encodeURIComponent(targetLang)+"&tl=ja&dt=t&q="+encodeURIComponent(translated);
    const backRes=await fetch(backUrl);
    const backData=await backRes.json();
    backTranslated=backData[0].map(x=>x[0]).join("");
  }

  if(request!==playRequest)return;
  makeTranslationDisplay(status,translated,targetLang);

  const backLine=document.createElement("div");
  backLine.textContent="逆翻訳： "+backTranslated;
  backLine.style.marginTop="6px";
  backLine.style.fontSize="14px";
  backLine.style.color="#666";
  status.appendChild(backLine);

  const controls=document.createElement("div");controls.className="play-controls";
  const replay=document.createElement("button");replay.className="translation-replay";replay.textContent="🔊 もう一度聞く";
  const stop=document.createElement("button");stop.className="stop";stop.textContent="■ 停止";stop.onclick=stopSpeaking;
  replay.onclick=()=>speak(translated,targetLang,stop);
  controls.append(replay,stop);status.appendChild(controls);
  speak(translated,targetLang,stop);
 }catch(e){
  if(request!==playRequest)return;
  status.textContent="翻訳に失敗しました。インターネット接続を確認してください。";
 }
}
function speak(text,language,stopButton){
 if(!("speechSynthesis" in window)){
  status.textContent="この端末では音声読み上げに対応していません。";
  return;
 }
 const token=++speechToken;
 speechSynthesis.cancel();
 setActiveStopButton(stopButton);
 let u=new SpeechSynthesisUtterance(text);
 u.lang=language;
 u.rate=.9;
 let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith(language.toLowerCase()));
 if(v)u.voice=v;
 u.onstart=()=>{if(token===speechToken)setActiveStopButton(stopButton);};
 u.onend=()=>{if(token===speechToken)setActiveStopButton(null);};
 u.onerror=()=>{if(token===speechToken)setActiveStopButton(null);};
 speechSynthesis.speak(u);
}

$("customSpeak").onclick=()=>{let t=$("custom").value.trim();if(t){selectedPhrase=null;buttons.querySelectorAll(".selected-phrase").forEach(x=>x.classList.remove("selected-phrase"));translateAndSpeak(t);}}

$("clearCustom").addEventListener("click",()=>{
  stopSpeaking();
  clearTimeout(liveTranslationTimer);
  liveTranslationRequestId++;
  $("custom").value="";
  status.innerHTML="";
  $("custom").focus();
});
$("addCustomPhrase").addEventListener("click",addCustomPhraseToCurrentPosition);
$("custom").addEventListener("input",scheduleLiveTranslation);
$("lang").addEventListener("change",function(){
  const text=$("custom").value.trim();
  if(text)showTranslationPreview(text);
});


if($("phraseEditInput"))$("phraseEditInput").addEventListener("input",schedulePhraseEditPreview);

if($("cancelPhraseEdit"))$("cancelPhraseEdit").addEventListener("click",closePhraseEdit);

if($("savePhraseEdit"))$("savePhraseEdit").addEventListener("click",()=>{
  if(editingPhraseIndex===null)return;
  const v=$("phraseEditInput").value.trim();
  if(!v)return;
  const arr=list();
  if(editingPhraseIndex<0 || editingPhraseIndex>=arr.length)return;
  const label=$("phraseDisplayInput").value.trim();
  arr[editingPhraseIndex]=label?{text:v,label}:v;
  save();
  render();
  closePhraseEdit();
  status.textContent="フレーズを変更しました。";
});

$("lang").addEventListener("change",()=>{
  const dlg=$("phraseEditDialog");
  if(dlg && dlg.classList.contains("show")){
    schedulePhraseEditPreview();
  }
});








render();

</script>
